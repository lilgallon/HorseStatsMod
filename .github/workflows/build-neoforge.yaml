name: build neoforge
on:
  pull_request:
    branches: [ "**" ]
    paths:
      - .github/workflows/build-neoforge.yaml
      - .github/scripts/**
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradle/**
      - buildSrc/**
      - common/**
      - neoforge/**
  push:
    branches: [ "main" ]
    paths:
      - .github/workflows/build-neoforge.yaml
      - .github/scripts/**
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradle/**
      - buildSrc/**
      - common/**
      - neoforge/**

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Gradle Build
        run: ./gradlew :neoforge:build
      - name: Install virtual display
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: NeoForge client smoke test
        if: ${{ runner.os == 'Linux' }}
        run: bash .github/scripts/smoke-run.sh neoforge client
      - name: NeoForge server smoke test
        if: ${{ runner.os == 'Linux' }}
        run: bash .github/scripts/smoke-run.sh neoforge server
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: neoforge/build/libs/
